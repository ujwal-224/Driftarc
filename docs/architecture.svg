      <text x="14" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">GitHub REST API</text>
      <text x="14" y="44" fill="#334155" font-family="sans-serif" font-size="11" font-weight="600">Octokit / GitHub Service</text>
      <text x="14" y="64" fill="#64748b" font-family="sans-serif" font-size="11">• Fetches remote repo tree</text>
      <text x="14" y="80" fill="#64748b" font-family="sans-serif" font-size="11">• Creates GitHub issues</text>
      <text x="14" y="96" fill="#64748b" font-family="sans-serif" font-size="11">• Zero token persistence</text>
