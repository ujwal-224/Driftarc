      <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">• Human-in-the-loop validation</text>
      <text x="14" y="58" fill="#64748b" font-family="sans-serif" font-size="11">• Edit extracted nodes &amp; connections</text>
