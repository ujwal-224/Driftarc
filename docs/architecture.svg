    <text x="90" y="16" fill="#1d4ed8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DRIFTARC ARCHITECTURE</text>
    
    <text x="0" y="52" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">DriftArc System Architecture</text>
    <text x="0" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Deterministic Codebase Scanner &amp; Multimodal Architecture Drift Detector</text>
  </g>

