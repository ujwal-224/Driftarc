      <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">• Match / Mismatch / Undocumented</text>
      <text x="14" y="58" fill="#64748b" font-family="sans-serif" font-size="11">• Verified line-level code citations</text>
