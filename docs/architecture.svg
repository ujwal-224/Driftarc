    <!-- Footnote -->
    <rect x="18" y="432" width="224" height="18" rx="4" fill="#f1f5f9" />
    <text x="130" y="445" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">HTTPS / REST Endpoints</text>
