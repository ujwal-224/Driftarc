      <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">• Architecture Diagram (PNG/JPG)</text>
      <text x="14" y="58" fill="#64748b" font-family="sans-serif" font-size="11">• Local workspace path or GitHub URL</text>
    </g>

