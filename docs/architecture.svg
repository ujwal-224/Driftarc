      <text x="14" y="44" fill="#581c87" font-family="sans-serif" font-size="11" font-weight="600">Visual Architecture Parser</text>
      <text x="14" y="64" fill="#64748b" font-family="sans-serif" font-size="11">• Input: Diagram Image</text>
      <text x="14" y="80" fill="#64748b" font-family="sans-serif" font-size="11">• Output: Components JSON</text>
      <text x="14" y="96" fill="#64748b" font-family="sans-serif" font-size="11">• Output: Connections JSON</text>
    </g>

    <!-- Service 2: Gemma 4 / Gemini Text -->
    <g transform="translate(18, 192)">
      <rect width="224" height="110" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
      <text x="14" y="24" fill="#6b21a8" font-family="sans-serif" font-size="13" font-weight="700">Gemma 4 / Gemini Text</text>
      <text x="14" y="44" fill="#581c87" font-family="sans-serif" font-size="11" font-weight="600">Issue Narrative Drafting</text>
      <text x="14" y="64" fill="#64748b" font-family="sans-serif" font-size="11">• Input: Verified Finding</text>
      <text x="14" y="80" fill="#64748b" font-family="sans-serif" font-size="11">• Output: Issue title &amp; text</text>
      <text x="14" y="96" fill="#64748b" font-family="sans-serif" font-size="11">• Never guesses evidence</text>
    </g>

    <!-- Service 3: GitHub REST API -->
